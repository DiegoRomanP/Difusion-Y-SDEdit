[project]
name = "pc3"
version = "0.1.0"
description = "DDPM para rostros anime: entrenamiento desde cero y fine-tuning reproducible"
readme = "README.md"
authors = [
    { name = "Diego Roman", email = "diego.roman.1234.dr@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "diffusers==0.42.1",
    "huggingface-hub>=1.32,<3",
    "imageio>=2.37,<3",
    "kagglehub>=0.4,<1",
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "pandas>=2.2,<4",
    "pillow>=11.3,<14",
    "safetensors>=0.8,<1",
    "torch-fidelity==0.4.0",
    "torchmetrics==1.9.0",
    "tqdm>=4.67,<5",
]

[project.scripts]
pc3 = "pc3:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[project.optional-dependencies]
cpu = ["torch==2.11.0", "torchvision==0.26.0"]
cu128 = ["torch==2.11.0", "torchvision==0.26.0"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

# Límite explícito: no heredar el workspace ni el entorno del directorio del curso.
[tool.uv.workspace]
members = []

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    { include-group = "presentation" },
    "nbformat>=5.10,<6",
    "numpy>=2.2,<3",
    "pillow>=11.3,<14",
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
]
notebook = [
    "ipykernel>=6.30,<8",
    "jupyterlab>=4.4,<5",
]
presentation = [
    "defusedxml>=0.7.1,<1",
    "pymupdf>=1.26,<2",
    "python-pptx>=1.0.2,<2",
]
