# Ensayo rápido de punta a punta (minutos): entrenar, generar y evaluar con el
# mismo código que el perfil real. NO es evidencia de calidad: 60 updates no
# entrenan nada. Sirve para comprobar que todo corre antes de una corrida larga.
seed = 2026
image_size = 64
dataset_handle = "splcher/animefacedataset/versions/3"
data_dir = "data/raw"
splits_file = "data/dataset_splits.json"
runs_dir = "runs"
batch_size = 32
accumulation_steps = 1
max_steps = 60
learning_rate = 0.0002
weight_decay = 0.000001
warmup_steps = 10
ema_decay = 0.999
ema_device = "cuda"
amp = true
gradient_checkpointing = false
num_workers = 2
log_every = 10
checkpoint_every = 30
validate_every = 30
validation_images = 64
sampling_steps = 50
sample_batch_size = 32
sample_count = 64
sample_seed = 12345
kid_subset_size = 32
kid_subsets = 4
